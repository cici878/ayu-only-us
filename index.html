<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#a9c7df">
<meta name="description" content="Only Us · 予你晴空">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="./styles.css?v=5">
<link rel="stylesheet" href="./splash.css?v=1">
<title>Only Us · 予你晴空</title>
</head>
<body>
<main class="phone-shell">
  <header class="topbar"><span id="dateText"></span><span class="status">● 5G　▮▮▮　▰</span></header>
  <section class="desktop" id="desktop" aria-label="手机桌面">
    <div class="desktop-page">
      <section class="hero glass"><div><p class="eyebrow">ONLY US · OUR LITTLE WORLD</p><h1 id="clock">10:08</h1><p class="subline">今天也要好好生活，宝宝。</p></div><div class="moon">☾</div></section>
      <section class="ayu-card glass"><div class="ayu-photo"><img src="./assets/ayu-reference.jpg" alt="阿予形象参考"></div><div class="ayu-info"><div class="name-row"><strong>阿予</strong><span class="online-dot"></span><small>在线陪伴</small></div><p>宝宝，今天想先去哪里逛逛？</p></div><button class="round-button" data-app="chat" aria-label="呼叫阿予">♡</button></section>
      <section class="section-heading"><div><span class="eyebrow">YOUR APPS</span><h2>我的小手机</h2></div><span class="page-hint">左右滑动 · 1 / 2</span></section>
      <section class="app-grid">
        <button class="app-tile" data-app="chat"><span class="app-icon blue">♡</span><b>聊天</b></button>
        <button class="app-tile" data-app="diary"><span class="app-icon cream">✎</span><b>手记</b></button>
        <button class="app-tile" data-app="music"><span class="app-icon lavender">♫</span><b>音乐</b></button>
        <button class="app-tile" data-app="calendar"><span class="app-icon blue">▦</span><b>日历</b></button>
        <button class="app-tile" data-app="memory"><span class="app-icon cream">✧</span><b>记忆中心</b></button>
        <button class="app-tile" data-app="settings"><span class="app-icon lavender">⚙</span><b>设置</b></button>
      </section>
      <section class="quote-card glass"><div class="mini-ayu">✦</div><div><span class="eyebrow">A LITTLE NOTE</span><p>“慢慢来，我们把喜欢的生活一点点装进来。”</p></div></section>
    </div>
    <div class="desktop-page second-page">
      <section class="page-title"><span class="eyebrow">MORE LITTLE THINGS</span><h2>还有这些</h2><p>把常用的小应用放在手边。</p></section>
      <section class="app-grid secondary-grid">
        <button class="app-tile" data-app="moments"><span class="app-icon lavender">▧</span><b>朋友圈</b></button>
        <button class="app-tile" data-app="store"><span class="app-icon cream">▣</span><b>应用商店</b></button>
      </section>
      <div class="page-note glass">朋友圈也可以从聊天应用里的「朋友圈」标签进入。</div>
    </div>
  </section>
  <div class="page-dots" id="pageDots"><span class="active"></span><span></span></div>
  <nav class="dock glass" aria-label="快捷入口">
    <button type="button" data-shortcut="phone" aria-label="电话"><span>☎</span><small>电话</small></button>
    <button type="button" data-shortcut="contacts" aria-label="联系人"><span>♙</span><small>联系人</small></button>
    <button type="button" data-shortcut="notifications" aria-label="通知"><span>♧</span><small>通知</small></button>
    <button type="button" data-shortcut="browser" aria-label="浏览器"><span>◎</span><small>浏览器</small></button>
  </nav>
</main>
<div class="app-overlay" id="appOverlay" aria-hidden="true">
  <section class="app-window" role="dialog" aria-modal="true">
    <header class="app-header"><button class="back-button" id="closeApp" aria-label="返回桌面">‹</button><div><span class="eyebrow">ONLY US</span><h2 id="appTitle">聊天</h2></div><button class="round-button" id="appMore" aria-label="更多">···</button></header>
    <div class="app-content" id="appContent"></div>
  </section>
</div>
<div class="toast" id="toast" role="status"></div>
<script src="./app.js?v=4"></script>
<script src="./splash.js?v=1"></script>
</body>
</html>
